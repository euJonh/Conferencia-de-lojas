databases:
  - name: conferencia-db
    plan: basic-256mb  # o plano gratuito do Render Postgres expira
    region: oregon

services:
  - type: web
    name: conferencia-lojas
    runtime: python
    plan: starter
    region: oregon
    branch: web
    buildCommand: ./web/build.sh
    startCommand: cd web && python manage.py migrate --noinput && gunicorn site_conferencia.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: conferencia-db
          property: connectionString
