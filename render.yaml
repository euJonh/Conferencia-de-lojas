services:
  - type: web
    name: conferencia-lojas
    runtime: python
    plan: free
    region: oregon
    branch: web
    healthCheckPath: /saude
    buildCommand: ./web/build.sh
    startCommand: cd web && python manage.py migrate --noinput && gunicorn site_conferencia.wsgi --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        sync: false  # string do Session pooler do Supabase, preenchida no painel do Render
